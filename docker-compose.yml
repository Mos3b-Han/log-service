services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: